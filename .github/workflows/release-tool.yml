name: Release Radix Designer tool
# On a version tag (v*): build the installable tool bundle, publish it as a GitHub Release zip,
# and list it (version, sha256, url) in public/tools.json, which Pages serves next to manifest.json.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - run: npm run build:tool
      - name: Zip the bundle
        run: |
          (cd dist-tool && zip -r -q "../radix-designer-$VERSION.zip" .)
          echo "SHA256=$(sha256sum "radix-designer-$VERSION.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "radix-designer-$VERSION.zip" --title "Radix Designer $VERSION" --notes "sha256: \`$SHA256\`"
      - name: List the release in tools.json on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/update-tools-json.mjs /tmp/update-tools-json.mjs
          git fetch origin main
          git checkout -f -B main origin/main
          node /tmp/update-tools-json.mjs "$VERSION" "$SHA256" "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/radix-designer-$VERSION.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tools.json
          git commit -m "List Radix Designer $VERSION in tools.json"
          git push origin main
          gh workflow run pages.yml --ref main
